name: Atualização Diária ITUB4

on:
  schedule:
    # Roda de segunda a sexta às 19h horário de Brasília (22h UTC)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # permite rodar manualmente pelo GitHub

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instala dependências
        run: |
          pip install yfinance xgboost tensorflow joblib numpy pandas

      - name: Roda o script de atualização
        run: python update.py

      - name: Commit e push do data.json atualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: atualiza previsão ITUB4 $(date +'%Y-%m-%d')"
          git push
